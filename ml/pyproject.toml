[project]
name = "ml"
version = "0.1.0"
description = "LoRA fine-tuning and evaluation of compact models for fact extraction from support tickets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9,<2.15",
    "transformers>=4.57",
    "peft>=0.17",
    "trl>=0.24",
    "datasets>=4.0",
    "accelerate>=1.10",
    "flash-linear-attention==0.6.0",
    "gliner2[train]==2.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["ruff>=0.15.12"]

[tool.ruff]
line-length = 120
