[project]
name = "gemma3-1b-cfe"
version = "0.1.0"
description = "LoRA SFT of Gemma 3 1B for the MTS CompactFactExtraction case"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "transformers==5.23.0",
    "peft==0.21.3",
    "trl==1.18.0",
    "accelerate==1.15.0",
    "datasets==5.2.0",
    "tokenizers==0.23.3",
    "pyyaml>=6.0",
    "sentencepiece>=0.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
