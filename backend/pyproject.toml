[project]
name = "support"
version = "0.1.0"
description = "Stateful customer-support agent with handoffs between specialist agents (hackathon template)"
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix-client>=3.5.0",
    "arize-phoenix-otel>=0.17.2",
    "beautifulsoup4>=4.15",
    "certifi>=2026.7.22",
    "fastapi>=0.161.1",
    "html-to-markdown>=3.22.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openinference-instrumentation-langchain>=0.1.79",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
support = "support.cli:main"
support-api = "support.api.app:main"
support-db = "support.db.init:main"
support-kb = "support.kb_import.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.12",
]
