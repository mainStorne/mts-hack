name: Run tests

on: [ push, pull_request ]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U support" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # The model is scripted in the tests: no model server is needed.
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://support:support@127.0.0.1:5432/support
