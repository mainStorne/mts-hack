name: Run prek

on: [ push, pull_request ]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync
      - run: uv run prek run --show-diff-on-failure --color=always --all-files --hook-stage manual
